map $http_upgrade $dicebot_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80;
    server_name 45.192.248.100;
    location ^~ /.well-known/acme-challenge/ { root /var/www/dicebot-acme; }
    location / { return 301 https://45.192.248.100:8443$request_uri; }
}
server {
    listen 8443 ssl http2;
    server_name 45.192.248.100;
    ssl_certificate /etc/letsencrypt/live/dicebot-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dicebot-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /opt/dicebot/current/web;
    index index.html;
    client_max_body_size 2m;
    access_log /var/log/nginx/dicebot-access.log;
    error_log /var/log/nginx/dicebot-error.log;

    # Bot 和管理员接口只在服务器内部通信，公网仅开放玩家接口。
    location ^~ /api/bot/ { return 404; }
    location /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location /ws/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dicebot_connection_upgrade;
        proxy_read_timeout 3600s;
    }
    # OneBot 通过独立路径跨越主机边界，令牌由 NoneBot 校验。
    location = /onebot/v11/ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dicebot_connection_upgrade;
        proxy_read_timeout 120s;
    }
    location ~ /\. { deny all; }
    location ~* \.(?:png|jpe?g|webp|svg|pdf|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
