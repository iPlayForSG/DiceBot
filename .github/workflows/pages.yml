name: Deploy tabletop website
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure realtime API
        env:
          API_URL: ${{ vars.TABLETOP_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "Set the TABLETOP_API_URL repository variable to the public HTTPS backend URL." >&2
            exit 1
          fi
          printf 'window.TABLETOP_API_URL = %s;\n' "$(python -c 'import json,os; print(json.dumps(os.environ["API_URL"]))')" > web/config.js
          python - <<'PY'
          import os
          from pathlib import Path
          page = Path("web/index.html")
          page.write_text(page.read_text(encoding="utf-8").replace("build=local", f"build={os.environ['GITHUB_RUN_ID']}"), encoding="utf-8")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
