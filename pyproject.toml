[project]
name = "dicebot"
version = "0.1.0"
description = "基于 NoneBot2 的 QQ 群桌游机器人"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi]>=2.4,<3",
    "nonebot-adapter-onebot>=2.4,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pillow>=11,<13"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

